version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - wrapcheck
    - wsl
    - tagliatelle
    - ireturn
    - containedctx
    - gochecknoglobals
    - paralleltest
    - tparallel
    - revive
    - embeddedstructfieldcheck
    # Deprecated in v2.12.0 and replaced by gomodguard_v2, which remains
    # enabled through default: all.
    - gomodguard

  settings:
    govet:
      enable-all: true
    gocyclo:
      min-complexity: 10
    funlen:
      lines: 60
      statements: 30
    varnamelen:
      ignore-names:
        - t
        - b
        - m
        - tt
        - ctx
        - err
        - id
        - fn

  exclusions:
    rules:
      # Example programs log ubus/RPC-derived fields for local debugging only.
      - path: ^examples/
        linters:
          - gosec
        text: G706

run:
  timeout: 10m
  go: '1.25'
  tests: true
