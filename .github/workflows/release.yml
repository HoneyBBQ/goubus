---
name: Release

'on':
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # yamllint disable rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        # yamllint enable rule:line-length
        with:
          go-version: '1.27'
          cache: true
      - name: golangci-lint
        # yamllint disable rule:line-length
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        # yamllint enable rule:line-length
        with:
          version: v2.15.0
      - name: Verify build
        run: go build ./...
      - name: Run tests
        run: go test -race ./...
      - name: Public API report is current
        run: go run ./internal/tools/apidump -check
      - name: Write the release notes
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/release-notes.md"
      - name: Release
        # yamllint disable rule:line-length
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        # yamllint enable rule:line-length
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
