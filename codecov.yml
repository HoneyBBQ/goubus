---
# Unit and integration runs upload separately, flagged, and Codecov merges them
# per commit. The total shown on the badge is that merge.
codecov:
  notify:
    # Unit job (Go 1.27) + 5 OpenWrt integration legs (21.02..25.12).
    after_n_builds: 6

# Informational: coverage is reported on pull requests, never a gate.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  unit:
    carryforward: false
  integration-21-02:
    carryforward: false
  integration-22-03:
    carryforward: false
  integration-23-05:
    carryforward: false
  integration-24-10:
    carryforward: false
  integration-25-12:
    carryforward: false

# Developer tools and test files, not the library.
ignore:
  - "internal/tools"
  - "**/*_test.go"
